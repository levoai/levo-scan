name: Levo scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: levo-scan
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the job prove to Levo which repository and environment it runs in.
  # Unused when you bring your own Scan App.
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: levo-scan
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
      groups: ${{ steps.build.outputs.groups }}
      job_timeout: ${{ steps.build.outputs.job_timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Lists what can be scanned and reads language statistics. Metadata only
      # -- this job never clones. The per-repository narrowing that matters is
      # applied again in the scan job below.
      #
      # With your own Scan App (APP_ID set) the token comes from its key.
      # Otherwise Levo issues a pass for the Levo GitHub App, and only to this
      # repository's workflow running in the levo-scan environment.
      - name: Read what your Scan App can see
        id: own-app
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get a planning pass from Levo
        id: levo-pass
        if: vars.APP_ID == ''
        env:
          LEVO_API: ${{ vars.LEVOAI_BASE_URL || 'https://api.levo.ai' }}
        run: |
          card=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$LEVO_API" | jq -r .value)
          resp=$(curl -sS -X POST -H "X-Levo-Workflow-Token: $card" "$LEVO_API/github/passes/plan")
          token=$(echo "$resp" | jq -r '.token // empty' 2>/dev/null || true)
          if [ -z "$token" ]; then
            echo "::error::Levo refused a planning pass: $resp"
            echo "::error::Install and connect the Levo GitHub App from Levo (Integrations > GitHub App), or set the APP_ID variable and APP_PRIVATE_KEY secret to use your own Scan App."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "$resp" | jq -c '{permissions, expires_at}'

      - name: Check the planning pass cannot read code
        if: vars.APP_ID == ''
        env:
          TOKEN: ${{ steps.levo-pass.outputs.token }}
        run: |
          repo=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/installation/repositories?per_page=100" | jq -r '[(.repositories // [])[] | select(.private)][0].full_name // empty')
          [ -n "$repo" ] || { echo "No private repository granted, so there is nothing to check."; exit 0; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$repo/contents/")
          echo "planning pass reading $repo contents -> HTTP $code (403 expected)"
          [ "$code" = "403" ] || [ "$code" = "404" ] || { echo "::error::The planning pass can read code."; exit 1; }

      - name: Build the scan matrix
        id: build
        env:
          GH_TOKEN: ${{ steps.own-app.outputs.token || steps.levo-pass.outputs.token }}
          CONTROL_REPO: ${{ github.repository }}
          MAX_JOBS: ${{ vars.LEVO_MAX_JOBS }}
        run: python3 .github/scripts/plan.py

  scan:
    needs: plan
    runs-on: ubuntu-latest
    # Above what this job's repositories may use between them, so each
    # repository's own limit is the one that fires.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job_timeout) }}
    environment: levo-scan
    # One repository failing must not fail the run.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      # One repository per job; above GitHub's 256 jobs, a few per job.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Pull the scanner
        run: docker pull --quiet levoai/code-scanner:latest

      # Per repository: a token for that repository alone, a check that it
      # cannot reach this repository, clone, scan and upload, then revoke.
      - name: Scan and upload
        id: scan
        env:
          REPOS: ${{ toJSON(fromJSON(needs.plan.outputs.groups)[matrix.job]) }}
          JOB: ${{ matrix.job }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          LEVO_AUTH_KEY: ${{ secrets.LEVOAI_AUTH_KEY }}
          LEVO_ORG_ID: ${{ secrets.LEVOAI_ORG_ID }}
          LEVO_BASE_URL: ${{ vars.LEVOAI_BASE_URL || 'https://api.levo.ai' }}
          CONTROL_REPO: ${{ github.repository }}
        run: python3 .github/scripts/scan.py

      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outputs.artifact != ''
        with:
          name: ${{ steps.scan.outputs.artifact }}
          path: ${{ steps.scan.outputs.path }}
          if-no-files-found: warn
