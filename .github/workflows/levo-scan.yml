name: Levo scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: levo-scan
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the job prove to Levo which repository and environment it runs in.
  # Unused when you bring your own Scan App.
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: levo-scan
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
      mode: ${{ steps.build.outputs.mode }}
      batches: ${{ steps.build.outputs.batches }}
      groups: ${{ steps.build.outputs.groups }}
      batch_timeout: ${{ steps.build.outputs.batch_timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Lists what can be scanned and reads language statistics. Metadata only
      # -- this job never clones. The per-repository narrowing that matters is
      # applied again in the scan job below.
      #
      # With your own Scan App (APP_ID set) the token comes from its key.
      # Otherwise Levo issues a pass for the Levo GitHub App, and only to this
      # repository's workflow running in the levo-scan environment.
      - name: Read what your Scan App can see
        id: own-app
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get a planning pass from Levo
        id: levo-pass
        if: vars.APP_ID == ''
        env:
          LEVO_API: ${{ vars.LEVOAI_BASE_URL || 'https://api.levo.ai' }}
        run: |
          card=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$LEVO_API" | jq -r .value)
          resp=$(curl -sS -X POST -H "X-Levo-Workflow-Token: $card" "$LEVO_API/github/passes/plan")
          token=$(echo "$resp" | jq -r '.token // empty' 2>/dev/null || true)
          if [ -z "$token" ]; then
            echo "::error::Levo refused a planning pass: $resp"
            echo "::error::Install and connect the Levo GitHub App from Levo (Integrations > GitHub App), or set the APP_ID variable and APP_PRIVATE_KEY secret to use your own Scan App."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "$resp" | jq -c '{permissions, expires_at}'

      - name: Check the planning pass cannot read code
        if: vars.APP_ID == ''
        env:
          TOKEN: ${{ steps.levo-pass.outputs.token }}
        run: |
          repo=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/installation/repositories?per_page=100" | jq -r '[(.repositories // [])[] | select(.private)][0].full_name // empty')
          [ -n "$repo" ] || { echo "No private repository granted, so there is nothing to check."; exit 0; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$repo/contents/")
          echo "planning pass reading $repo contents -> HTTP $code (403 expected)"
          [ "$code" = "403" ] || [ "$code" = "404" ] || { echo "::error::The planning pass can read code."; exit 1; }

      - name: Build the scan matrix
        id: build
        env:
          GH_TOKEN: ${{ steps.own-app.outputs.token || steps.levo-pass.outputs.token }}
          CONTROL_REPO: ${{ github.repository }}
          MAX_JOBS: ${{ vars.LEVO_MAX_JOBS }}
        run: |
          python3 - <<'PY'
          import json, math, os, re, sys, urllib.error, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          import yaml

          TOKEN = os.environ["GH_TOKEN"]
          NAME_RE = re.compile(r"^[A-Za-z0-9 ._-]{1,80}$")

          # Anything atom can analyse. A repository whose main language is not
          # here is skipped with a reason rather than scanned pointlessly.
          ALIASES = {
              "c#": "csharp", "csharp": "csharp", ".net": "csharp", "dotnet": "csharp",
              "javascript": "javascript", "typescript": "typescript",
              "java": "java", "kotlin": "kotlin",
              "python": "python", "ruby": "ruby", "php": "php",
              "rust": "rust", "go": "go",
          }

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def all_granted():
              """Every page, not just the first. A single page silently caps
              discovery at 100 repositories and drops the rest without a word."""
              out, page = [], 1
              while True:
                  batch = api(f"/installation/repositories?per_page=100&page={page}")
                  repos = batch.get("repositories", [])
                  out.extend(repos)
                  if len(repos) < 100:
                      return out
                  page += 1
                  if page > 30:  # 3,000 repositories; far past any real installation
                      print("::warning::Stopped paging at 3,000 repositories.")
                      return out

          try:
              cfg = yaml.safe_load(open("levo-config.yml")) or {}
          except FileNotFoundError:
              cfg = {}
          except Exception as exc:
              die(f"levo-config.yml is not valid YAML: {exc}")

          if cfg.get("version") not in (None, 1):
              die(f"Unsupported config version: {cfg.get('version')!r}. Expected 1.")

          defaults = cfg.get("defaults") or {}
          env_name = str(defaults.get("env_name", "staging"))
          timeout = max(60, min(2400, int(defaults.get("scan_timeout", 1800))))

          # Per-repository overrides, keyed by "owner/name". Everything in here
          # is optional; a repository with no entry still gets scanned.
          overrides = {}
          for item in (cfg.get("repositories") or []):
              repo = str(item.get("repo", ""))
              if repo:
                  overrides[repo] = item

          exclude = {str(x) for x in (cfg.get("exclude") or [])}
          exclude.add(os.environ["CONTROL_REPO"])

          # The GitHub App's installation is the source of truth for scope. A
          # repository listed in config but not granted cannot be scanned, and a
          # repository granted but not listed still should be.
          granted = all_granted()
          if not granted:
              die("The GitHub App has not been granted access to any repository.")

          # Read several at once: one by one, a large organisation outlasts this
          # job's time limit before the first scan starts.
          def languages(full):
              try:
                  return api(f"/repos/{full}/languages")
              except urllib.error.HTTPError as exc:
                  return exc

          to_read = [r["full_name"] for r in granted
                     if r["full_name"] != os.environ["CONTROL_REPO"]
                     and r["full_name"] not in exclude
                     and not r.get("archived")
                     and not str(overrides.get(r["full_name"], {}).get("language", "")).strip()]
          with ThreadPoolExecutor(max_workers=8) as pool:
              read = dict(zip(to_read, pool.map(languages, to_read)))

          entries, skipped = [], []
          for repo in granted:
              full = repo["full_name"]
              if full == os.environ["CONTROL_REPO"]:
                  continue  # the control repo holds configuration, not an API
              if full in exclude:
                  skipped.append((full, "excluded in levo-config.yml"))
                  continue
              if repo.get("archived"):
                  skipped.append((full, "archived"))
                  continue

              item = overrides.get(full, {})

              lang = str(item.get("language", "")).strip().lower()
              if not lang:
                  langs = read[full]
                  if isinstance(langs, urllib.error.HTTPError):
                      skipped.append((full, f"could not read languages ({langs.code})"))
                      continue
                  if not langs:
                      skipped.append((full, "GitHub reports no language for this repository"))
                      continue
                  # The largest language the scanner reads, not the largest
                  # overall: HTML or a notebook can outweigh the API beside it.
                  supported = {n: b for n, b in langs.items() if n.lower() in ALIASES}
                  if not supported:
                      top = max(langs.items(), key=lambda kv: kv[1])[0].lower()
                      skipped.append((full, f"language '{top}' is not supported by the scanner"))
                      continue
                  lang = max(supported.items(), key=lambda kv: kv[1])[0].lower()

              resolved = ALIASES.get(lang)
              if resolved is None:
                  skipped.append((full, f"language '{lang}' is not supported by the scanner"))
                  continue

              app = str(item.get("app_name", "")).strip() or repo["name"]
              if not NAME_RE.match(app):
                  skipped.append((full, f"app_name {app!r} contains unsupported characters"))
                  continue

              entries.append({
                  "repo": full, "owner": repo["owner"]["login"], "name": repo["name"], "id": repo["id"],
                  "language": resolved, "app_name": app,
                  "env_name": env_name, "timeout": timeout,
              })

          print(f"{len(granted)} repository/repositories granted to the GitHub App\n")
          if entries:
              print("Will scan:")
              for e in entries:
                  print(f"  {e['repo']:45} {e['language']:12} -> {e['app_name']}")
          if skipped:
              print("\nSkipped:")
              for full, reason in skipped:
                  print(f"  {full:45} {reason}")

          if not entries:
              die("Nothing to scan. Grant the GitHub App access to a repository, "
                  "or check the skip reasons above.")

          # GitHub starts at most 256 jobs from one matrix and rejects the rest of
          # the run with an error that does not say why. Past that, each job scans
          # a batch, one repository at a time, each with its own pass.
          try:
              max_jobs = max(1, min(256, int(os.environ.get("MAX_JOBS") or 256)))
          except ValueError:
              die("The LEVO_MAX_JOBS variable must be a number.")

          # groups[n] is batch n's repositories; groups[0] is never used, so batch
          # numbers can start at 1.
          groups = [[]]
          if len(entries) <= max_jobs:
              mode, matrix, batch_timeout = "single", {"include": entries}, 60
          else:
              per_job = math.ceil(len(entries) / max_jobs)
              # A repository may use all of scan_timeout plus a few minutes to clone
              # and upload, and a job must end inside GitHub's six hours.
              per_repo = timeout / 60 + 3
              fits = int(330 // per_repo)
              if per_job > fits:
                  die(f"{len(entries)} repositories qualify, but with scan_timeout {timeout} "
                      f"one run can scan at most {max_jobs * fits}. Lower scan_timeout, "
                      "narrow the GitHub App's repository access, or add repositories to "
                      "exclude in levo-config.yml.")
              groups += [entries[i:i + per_job] for i in range(0, len(entries), per_job)]
              mode, matrix = "batch", {"include": [{"repo": ""}]}
              batch_timeout = min(355, math.ceil(per_job * per_repo) + 10)
              print(f"\nMore than {max_jobs} repositories qualify, so each job scans up to "
                    f"{per_job}, one after another: {len(groups) - 1} jobs.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
              fh.write(f"count={len(entries)}\n")
              fh.write(f"mode={mode}\n")
              fh.write(f"batches={json.dumps(list(range(1, len(groups))) or [0])}\n")
              fh.write(f"groups={json.dumps(groups, separators=(',', ':'))}\n")
              fh.write(f"batch_timeout={batch_timeout}\n")
          PY

  scan:
    needs: plan
    if: needs.plan.outputs.mode != 'batch'
    runs-on: ubuntu-latest
    # Above the 40-minute scan_timeout ceiling, so the scanner's own limit is the one that fires.
    timeout-minutes: 55
    environment: levo-scan
    # One repository failing must not fail the run.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Mint a clone token scoped to this repository only
        id: own-app
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}

      - name: Get a read pass for this repository only
        id: levo-pass
        if: vars.APP_ID == ''
        env:
          LEVO_API: ${{ vars.LEVOAI_BASE_URL || 'https://api.levo.ai' }}
          REPO_ID: ${{ matrix.id }}
        run: |
          card=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$LEVO_API" | jq -r .value)
          resp=$(curl -sS -X POST -H "X-Levo-Workflow-Token: $card" -H "Content-Type: application/json" \
            -d "{\"repository_id\": $REPO_ID}" "$LEVO_API/github/passes/scan")
          token=$(echo "$resp" | jq -r '.token // empty' 2>/dev/null || true)
          [ -n "$token" ] || { echo "::error::Levo refused a read pass: $resp"; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "$resp" | jq -c '{permissions, repositories, expires_at}'

      - name: Negative control - token must not reach the control repo
        env:
          TOKEN: ${{ steps.own-app.outputs.token || steps.levo-pass.outputs.token }}
          CONTROL_REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$CONTROL_REPO")
          echo "control repo via clone token -> HTTP $code (404 expected)"
          [ "$code" = "404" ] || { echo "::error::Clone token is too broad."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.own-app.outputs.token || steps.levo-pass.outputs.token }}
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Scan and upload
        env:
          LEVO_AUTH_KEY: ${{ secrets.LEVOAI_AUTH_KEY }}
          LEVO_ORG_ID: ${{ secrets.LEVOAI_ORG_ID }}
          LEVO_BASE_URL: ${{ vars.LEVOAI_BASE_URL || 'https://api.levo.ai' }}
          APP_NAME: ${{ matrix.app_name }}
          ENV_NAME: ${{ matrix.env_name }}
          LANGUAGE: ${{ matrix.language }}
          SCAN_TIMEOUT: ${{ matrix.timeout }}
        run: |
          ARGS=(--language "$LANGUAGE" --scan-timeout "$SCAN_TIMEOUT")
          if [ -n "$LEVO_AUTH_KEY" ]; then
            echo "Upload mode: results go to $LEVO_BASE_URL as '$APP_NAME' / $ENV_NAME"
            ARGS+=(--app-name "$APP_NAME" --env-name "$ENV_NAME" -k "$LEVO_AUTH_KEY" -o "$LEVO_ORG_ID")
          else
            echo "::notice::LEVOAI_AUTH_KEY not set - generating the spec locally only."
            ARGS+=(--no-upload --output /workspace/levo-openapi.json)
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e LEVO_BASE_URL -e LEVO_SCAN_TIMEOUT="$SCAN_TIMEOUT" \
            -v "$PWD/product":/workspace:rw \
            levoai/code-scanner:latest "${ARGS[@]}"

      - name: Summarise what was discovered
        if: always()
        run: |
          SPEC=$(find product \( -name 'levo-openapi.json' -o -name 'openapi_spec.json' \) 2>/dev/null | head -1)
          if [ -z "$SPEC" ]; then echo "No spec produced."; exit 0; fi
          python3 - "$SPEC" <<'PY'
          import json, re, sys
          spec = json.load(open(sys.argv[1]))
          methods = {"get","put","post","delete","patch","head","options","trace"}
          ops = [(p, m.upper()) for p, i in spec.get("paths", {}).items()
                 for m in i if m.lower() in methods]
          # A path derived from a source filename is not an endpoint. Counting
          # them inflates every downstream number, including billing.
          junk = re.compile(r"/(py|java|go|js|ts|rb|cs|php)$")
          real = [o for o in ops if not junk.search(o[0])]
          print(f"{len(real)} real operations ({len(ops) - len(real)} filename artefacts filtered)")
          for path, method in sorted(real):
              print(f"  {method:7} {path}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-${{ matrix.name }}
          path: |
            product/levo-openapi.json
            product/scan-results/**/openapi_spec.json
          if-no-files-found: warn

      # Your own Scan App's token is revoked by its action; a Levo pass is revoked here.
      - name: Revoke the read pass
        if: always() && steps.levo-pass.outputs.token != ''
        env:
          TOKEN: ${{ steps.levo-pass.outputs.token }}
        run: |
          curl -s -o /dev/null -w "revoke -> HTTP %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $TOKEN" https://api.github.com/installation/token

  # Runs instead of `scan` only when more repositories qualify than one run has
  # jobs for. Each job pulls the scanner once, then scans its repositories one
  # at a time, each with its own read-only token for that repository alone.
  scan-batch:
    needs: plan
    if: needs.plan.outputs.mode == 'batch'
    name: scan batch
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.batch_timeout) }}
    environment: levo-scan
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}

    steps:
      - name: Pull the scanner once for this batch
        run: |
          for attempt in 1 2 3; do
            docker pull --quiet levoai/code-scanner:latest && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      - name: Scan each repository in this batch
        env:
          REPOS: ${{ toJSON(fromJSON(needs.plan.outputs.groups)[matrix.batch]) }}
          BATCH: ${{ matrix.batch }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          LEVO_AUTH_KEY: ${{ secrets.LEVOAI_AUTH_KEY }}
          LEVO_ORG_ID: ${{ secrets.LEVOAI_ORG_ID }}
          LEVO_BASE_URL: ${{ vars.LEVOAI_BASE_URL || 'https://api.levo.ai' }}
          CONTROL_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, glob, json, os, re, shutil, subprocess, sys, time
          import urllib.error, urllib.request

          IMAGE = "levoai/code-scanner:latest"
          REPOS = json.loads(os.environ["REPOS"])
          PRODUCT = os.path.join(os.environ["GITHUB_WORKSPACE"], "product")
          SPECS = os.path.join(os.environ["GITHUB_WORKSPACE"], "specs")
          LEVO_API = os.environ["LEVO_BASE_URL"]
          APP_ID = os.environ.get("APP_ID", "")
          METHODS = {"get", "put", "post", "delete", "patch", "head", "options", "trace"}
          JUNK = re.compile(r"/(py|java|go|js|ts|rb|cs|php)$")

          class Failed(Exception):
              pass

          class Unsafe(Failed):
              pass

          def mask(secret):
              print(f"::add-mask::{secret}", flush=True)

          def call(method, url, headers, body=None):
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  headers = {**headers, "Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode(errors="replace"), r.headers
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode(errors="replace"), exc.headers

          def github(token):
              return {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          def levo_pass(repository_id):
              for attempt in range(6):
                  status, body, _ = call(
                      "GET", os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + LEVO_API,
                      {"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
                  if status != 200:
                      raise Failed(f"GitHub did not issue this job's identity token (HTTP {status})")
                  status, body, headers = call(
                      "POST", f"{LEVO_API}/github/passes/scan",
                      {"X-Levo-Workflow-Token": json.loads(body)["value"]},
                      {"repository_id": repository_id})
                  try:
                      granted = json.loads(body)
                  except ValueError:
                      granted = {}
                  if granted.get("token"):
                      mask(granted["token"])
                      print(json.dumps({k: granted.get(k) for k in ("permissions", "repositories", "expires_at")}))
                      return granted["token"]
                  if status in (429, 503) and attempt < 5:
                      try:
                          wait = min(120, max(1, int(headers.get("Retry-After") or 30)))
                      except ValueError:
                          wait = 30
                      print(f"Levo asked to retry in {wait}s (HTTP {status})", flush=True)
                      time.sleep(wait)
                      continue
                  raise Failed(f"Levo refused a read pass: {body[:300]}")

          def b64url(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

          def app_jwt():
              now = int(time.time())
              signing = (b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode()) + "."
                         + b64url(json.dumps({"iat": now - 60, "exp": now + 540, "iss": APP_ID}).encode()))
              signed = subprocess.run(["openssl", "dgst", "-sha256", "-sign", KEY_FILE],
                                      input=signing.encode(), capture_output=True)
              if signed.returncode != 0:
                  raise Failed("APP_PRIVATE_KEY is not a valid private key")
              return signing + "." + b64url(signed.stdout)

          installations = {}

          def own_app_token(owner, name):
              jwt = app_jwt()
              if owner not in installations:
                  status, body, _ = call("GET", f"https://api.github.com/repos/{owner}/{name}/installation", github(jwt))
                  if status != 200:
                      raise Failed(f"your Scan App is not installed on {owner}/{name} (HTTP {status})")
                  installations[owner] = json.loads(body)["id"]
              status, body, _ = call(
                  "POST", f"https://api.github.com/app/installations/{installations[owner]}/access_tokens",
                  github(jwt), {"repositories": [name], "permissions": {"contents": "read"}})
              if status != 201:
                  raise Failed(f"your Scan App could not issue a token for {owner}/{name} (HTTP {status}): {body[:200]}")
              token = json.loads(body)["token"]
              mask(token)
              return token

          def summarise(entry):
              found = [p for p in [os.path.join(PRODUCT, "levo-openapi.json")]
                       + sorted(glob.glob(os.path.join(PRODUCT, "scan-results", "**", "openapi_spec.json"), recursive=True))
                       if os.path.isfile(p)]
              if not found:
                  print("No spec produced.")
                  return None
              for path in found:
                  keep = os.path.join(SPECS, entry["name"], os.path.relpath(path, PRODUCT))
                  os.makedirs(os.path.dirname(keep), exist_ok=True)
                  shutil.copyfile(path, keep)
              spec = json.load(open(found[0]))
              ops = [(p, m.upper()) for p, i in spec.get("paths", {}).items()
                     for m in i if m.lower() in METHODS]
              real = [o for o in ops if not JUNK.search(o[0])]
              print(f"{len(real)} real operations ({len(ops) - len(real)} filename artefacts filtered)")
              for path, method in sorted(real):
                  print(f"  {method:7} {path}")
              return len(real)

          def scan(entry, token):
              status, _, _ = call("GET", f"https://api.github.com/repos/{os.environ['CONTROL_REPO']}", github(token))
              print(f"control repo via clone token -> HTTP {status} (404 expected)")
              if status != 404:
                  raise Unsafe("the clone token can reach the control repository; it is too broad")

              shutil.rmtree(PRODUCT, ignore_errors=True)
              auth = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              mask(auth)
              try:
                  clone = subprocess.run(
                      ["git", "-c", f"http.https://github.com/.extraheader=AUTHORIZATION: basic {auth}",
                       "clone", "--depth", "1", "--no-tags", "--quiet",
                       f"https://github.com/{entry['repo']}.git", PRODUCT],
                      env={**os.environ, "GIT_LFS_SKIP_SMUDGE": "1", "GIT_TERMINAL_PROMPT": "0"},
                      capture_output=True, text=True, timeout=1200)
              except subprocess.TimeoutExpired:
                  raise Failed("clone took longer than 20 minutes") from None
              if clone.returncode != 0:
                  raise Failed(f"clone failed: {clone.stderr.strip()[-300:]}")

              timeout = int(entry["timeout"])
              args = ["--language", entry["language"], "--scan-timeout", str(timeout)]
              if os.environ.get("LEVO_AUTH_KEY"):
                  print(f"Upload mode: results go to {LEVO_API} as '{entry['app_name']}' / {entry['env_name']}")
                  args += ["--app-name", entry["app_name"], "--env-name", entry["env_name"],
                           "-k", os.environ["LEVO_AUTH_KEY"], "-o", os.environ["LEVO_ORG_ID"]]
              else:
                  print("::notice::LEVOAI_AUTH_KEY not set - generating the spec locally only.")
                  args += ["--no-upload", "--output", "/workspace/levo-openapi.json"]
              container = f"levo-scan-{os.environ['BATCH']}-{entry['id']}"
              try:
                  ran = subprocess.run(
                      ["docker", "run", "--rm", "--name", container, "--user", f"{os.getuid()}:{os.getgid()}",
                       "-e", "LEVO_BASE_URL", "-e", f"LEVO_SCAN_TIMEOUT={timeout}",
                       "-v", f"{PRODUCT}:/workspace:rw", IMAGE, *args],
                      timeout=timeout + 300)
              except subprocess.TimeoutExpired:
                  subprocess.run(["docker", "rm", "-f", container], capture_output=True)
                  raise Failed(f"still running {timeout + 300}s after it started, so it was stopped")
              if ran.returncode != 0:
                  raise Failed(f"the scanner exited with code {ran.returncode}")

          KEY_FILE = os.path.join(os.environ["RUNNER_TEMP"], "scan-app.pem")
          if APP_ID:
              with os.fdopen(os.open(KEY_FILE, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), "w") as fh:
                  fh.write(os.environ["APP_PRIVATE_KEY"])

          results, stopped = [], None
          for n, entry in enumerate(REPOS, 1):
              if stopped:
                  results.append((entry, "not scanned: " + stopped, None, 0))
                  continue
              print(f"::group::{n}/{len(REPOS)} {entry['repo']} ({entry['language']})", flush=True)
              start, token, outcome, operations = time.time(), "", "scanned", None
              try:
                  if APP_ID:
                      token = own_app_token(entry["owner"], entry["name"])
                  else:
                      token = levo_pass(entry["id"])
                  scan(entry, token)
              except Unsafe as exc:
                  outcome, stopped = f"failed: {exc}", str(exc)
              except Exception as exc:
                  outcome = f"failed: {exc}"
              finally:
                  try:
                      operations = summarise(entry)
                  except Exception as exc:
                      print(f"Could not read the spec: {exc}")
                  shutil.rmtree(PRODUCT, ignore_errors=True)
                  if token:
                      try:
                          status, _, _ = call("DELETE", "https://api.github.com/installation/token", github(token))
                          print(f"revoke -> HTTP {status}")
                      except Exception as exc:
                          print(f"::warning::Could not revoke the token; it expires within the hour: {exc}")
                  print("::endgroup::", flush=True)
              if outcome != "scanned":
                  print(f"::error::{entry['repo']}: {outcome}")
              results.append((entry, outcome, operations, round(time.time() - start)))

          if APP_ID:
              os.remove(KEY_FILE)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### Batch {os.environ['BATCH']}\n\n"
                       "| Repository | Language | Result | Operations | Time |\n|---|---|---|---|---|\n")
              for entry, outcome, operations, seconds in results:
                  cell = outcome.replace("|", "\\|").replace("\n", " ")
                  ops = "-" if operations is None else operations
                  fh.write(f"| {entry['repo']} | {entry['language']} | {cell} | {ops} | {seconds}s |\n")

          failed = [r for r in results if r[1] != "scanned"]
          print(f"\n{len(results) - len(failed)} of {len(results)} repositories scanned.")
          sys.exit(1 if failed else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specs-batch-${{ matrix.batch }}
          path: specs/
          if-no-files-found: warn
