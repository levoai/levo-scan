# Levo scan configuration.
#
# Everything here is OPTIONAL. What gets scanned is decided by which
# repositories you granted the Scan App access to, not by this file.
#
# Use it only to override what is detected automatically.
version: 1

defaults:
  # The environment your endpoints are tagged with in Levo. Change this to
  # whatever you actually run -- production, NonProd, uat. It applies to
  # everything this control repository scans.
  env_name: staging
  # Per-repository time limit, in seconds. Between 60 and 2400 (40 minutes).
  scan_timeout: 1800

# Repositories to leave out, even though the Scan App can see them.
exclude: []
  # - your-org/frontend-app

# Per-repository overrides. Anything omitted is detected:
#   language  - from GitHub's language statistics
#   app_name  - defaults to the repository name
repositories: []
  # - repo: your-org/payments-api
  #   language: java
  #   app_name: Payments API
